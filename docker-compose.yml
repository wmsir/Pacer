services:
  wmdb-mysql:
    image: mysql:8.0
    container_name: wmdb-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${WMDB_DB_PASSWORD:?WMDB_DB_PASSWORD is required}
      MYSQL_DATABASE: wmdb
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
    # 数据库仅限内部容器通信，不直接暴露宿主机公网端口
    expose:
      - "3306"
    networks:
      - wmdb-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  wmdb-redis:
    image: redis:7.0-alpine
    container_name: wmdb-redis
    restart: always
    environment:
      TZ: Asia/Shanghai
    # 启用密码保护，内部通信
    command: redis-server --requirepass "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
    expose:
      - "6379"
    networks:
      - wmdb-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  wmdb-minio:
    image: minio/minio
    container_name: wmdb-minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      TZ: Asia/Shanghai
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    # 存储只对内网提供服务，控制台仅绑定本机
    ports:
      - "127.0.0.1:9001:9001"
    expose:
      - "9000"
    networks:
      - wmdb-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  wmdb-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wmdb-backend
    restart: always
    environment:
      - TZ=Asia/Shanghai
      - WMDB_DB_URL=jdbc:mysql://wmdb-mysql:3306/wmdb?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
      - WMDB_DB_USERNAME=root
      - WMDB_DB_PASSWORD=${WMDB_DB_PASSWORD:?WMDB_DB_PASSWORD is required}
      - MINIO_ENDPOINT=http://wmdb-minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      - MINIO_BUCKET=${MINIO_BUCKET:-wmdb-attachments}
      - SPRING_DATA_REDIS_HOST=wmdb-redis
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - WMDB_JWT_SECRET=${WMDB_JWT_SECRET:?WMDB_JWT_SECRET is required}
      - WMDB_RSA_PRIVATE_KEY=${WMDB_RSA_PRIVATE_KEY}
      - WMDB_DB_AES_KEY=${WMDB_DB_AES_KEY}
    ports:
      - "127.0.0.1:8088:8088"
    depends_on:
      wmdb-mysql:
        condition: service_healthy
      wmdb-redis:
        condition: service_healthy
      wmdb-minio:
        condition: service_healthy
    networks:
      - wmdb-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8088/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  wmdb-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wmdb-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      wmdb-backend:
        condition: service_healthy
    networks:
      - wmdb-network
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  mysql-data:
  minio-data:

networks:
  wmdb-network:
    driver: bridge
