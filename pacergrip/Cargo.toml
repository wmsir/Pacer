[workspace]
resolver = "2"
members = [
  "crates/pacer-core",
  "crates/pacer-dbeaver-io",
  "crates/pacer-sql-ast",
  "crates/pacer-drivers",
  "crates/pacer-client",
  "src-tauri",
]

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
quick-xml = "0.37"
zip = { version = "2", default-features = false, features = ["deflate"] }
sqlparser = "0.53"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "native-tls"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-native-tls", "mysql", "postgres", "sqlite", "json", "chrono"] }
encoding_rs = "0.8"
chardetng = "0.1"
aes = "0.8"
cbc = "0.1"
