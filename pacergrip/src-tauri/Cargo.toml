[package]
name = "pacergrip-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "pacergrip_app_lib"
crate-type = ["rlib"]

[[bin]]
name = "Pacer"
path = "src/main.rs"

[features]
default = []
pacer-extension = ["dep:pacer-client"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
pacer-core = { path = "../crates/pacer-core" }
pacer-drivers = { path = "../crates/pacer-drivers" }
pacer-dbeaver-io = { path = "../crates/pacer-dbeaver-io" }
pacer-sql-ast = { path = "../crates/pacer-sql-ast" }
pacer-client = { path = "../crates/pacer-client", optional = true }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
aes.workspace = true
cbc.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
log.workspace = true
uuid.workspace = true
chrono.workspace = true
zeroize.workspace = true
