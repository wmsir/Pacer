name: Release Pacer Windows

on:
  push:
    tags:
      - 'pacer-v*'
      - 'pacergrip-v*'

permissions:
  contents: write

jobs:
  release-windows:
    name: Build & Publish Pacer Release (Windows x64)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: pacergrip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: pacergrip/ui/package-lock.json

      - name: Setup Rust toolchain (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'pacergrip -> target'
          shared-key: pacergrip-win

      - name: Install UI dependencies
        working-directory: pacergrip/ui
        run: npm ci

      - name: Build UI bundle
        working-directory: pacergrip/ui
        run: npm run build

      - name: Run Rust unit and SQLite integration tests
        run: cargo test --workspace --exclude pacergrip-app

      - name: Run Clippy static checks
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build Windows portable EXE & NSIS installer
        run: .\ui\node_modules\.bin\tauri.cmd build --bundles nsis

      - name: Collect Windows executables & SHA256 checksums
        run: |
          New-Item -ItemType Directory -Force -Path dist-win | Out-Null
          $portable = "target/release/Pacer.exe"
          if (-not (Test-Path $portable)) {
            throw "Expected portable executable not found at $portable"
          }
          Copy-Item $portable "dist-win/Pacer-windows-x64-portable.exe"

          $nsisFiles = Get-ChildItem "target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue
          if (-not $nsisFiles) {
            throw "No NSIS setup executable produced under target/release/bundle/nsis/"
          }
          Copy-Item $nsisFiles.FullName "dist-win/"

          Get-ChildItem "dist-win/*.exe" | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -Path "dist-win/SHA256SUMS.txt" -Encoding UTF8

          Get-ChildItem dist-win

      - name: Upload Release build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pacer-${{ github.ref_name }}-windows-x64
          path: pacergrip/dist-win/*
          retention-days: 30
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Pacer ${{ github.ref_name }} (Windows x64)"
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## Pacer `${{ github.ref_name }}` — 原生数据库桌面 IDE (Windows x64)

            ### 下载说明 / Downloads
            - **`Pacer-windows-x64-portable.exe`**：绿色便携单文件版（无需安装，双击即用）。
            - **`Pacer_*_x64-setup.exe`**：Windows NSIS 安装包（支持简中/英文安装向导，当前用户安装并自动引导安装缺失的 WebView2 Runtime）。
            - **`SHA256SUMS.txt`**：SHA-256 完整性校验文件。

            ### 核心特性 / Highlights
            - **全工作区项目/数据源统一对齐**：控制台输出、执行历史与顶部运行器下拉选项均与左侧数据库树保持 100% 一致的分组与项目名称；控制台输出默认展示「全部项目」，支持项目/数据源级联筛选、彩色项目标签与统一日志复制/清理。
            - **可配置快捷键 (Keymap 设置器)**：支持点击任意功能实时录制组合键（自动冲突检测与覆盖提示）、支持 `IDEA / DataGrip 默认` 与 `VS Code / DBeaver` 一键切换、支持自定义字号缩放、单独清空或恢复默认，修改后编辑器与全局即时生效并持久化。
            - **商业化高频增强打磨**：
              - **工作区会话恢复 & 未保存防误关**：重启自动恢复上次打开的标签页与控制台内容；关闭已修改磁盘文档时弹出「保存 / 不保存并关闭」确认框。
              - **结果集高级分析与 Pin 固定**：支持固定对比结果页不被新查询覆盖、一键「复制列 `IN (...)` 条件」、复制选中行 JSON、实时列统计栏（总行 / 非空 / 去重 / SUM / AVG / MIN / MAX）。
              - **编辑器字号缩放与自动换行**：状态栏支持切换自动换行与调整 `11px–22px` 字号（`Ctrl+=` / `Ctrl+-` / `Ctrl+0`）。
            - **三套护眼主题 & 纯净树形面板 & 标签右键菜单**：支持「深色 Darcula」「浅色 Light」「绿豆沙护眼色（`#CCE8CF`）」；修复最后控制台关闭问题并支持标签页右键批量关闭；右侧文档树纯树形折叠且「最近打开的文件」可收起或隐藏。

            **运行环境 / System Requirement**：Windows 10 / 11 (x64)。
          files: pacergrip/dist-win/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
