name: Release Pacer (Windows & macOS)

on:
  push:
    tags:
      - 'pacer-v*'
      - 'pacergrip-v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Pacer (Windows x64)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: pacergrip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: pacergrip/ui/package-lock.json

      - name: Setup Rust toolchain (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'pacergrip -> target'
          shared-key: pacergrip-win

      - name: Install UI dependencies
        working-directory: pacergrip/ui
        run: npm ci

      - name: Build UI bundle
        working-directory: pacergrip/ui
        run: npm run build

      - name: Run Rust unit and SQLite integration tests
        run: cargo test --workspace --exclude pacergrip-app

      - name: Run Clippy static checks
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build Windows portable EXE & NSIS installer
        run: .\ui\node_modules\.bin\tauri.cmd build --bundles nsis

      - name: Collect Windows executables
        run: |
          New-Item -ItemType Directory -Force -Path dist-win | Out-Null
          $portable = "target/release/Pacer.exe"
          if (-not (Test-Path $portable)) {
            throw "Expected portable executable not found at $portable"
          }
          Copy-Item $portable "dist-win/Pacer-windows-x64-portable.exe"

          $nsisFiles = Get-ChildItem "target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue
          if (-not $nsisFiles) {
            throw "No NSIS setup executable produced under target/release/bundle/nsis/"
          }
          Copy-Item $nsisFiles.FullName "dist-win/"
          Get-ChildItem dist-win

      - name: Upload Windows Release artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: pacergrip/dist-win/*.exe
          retention-days: 30
          if-no-files-found: error

  build-macos:
    name: Build Pacer (macOS ${{ matrix.arch_label }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch_label: arm64
            dmg_suffix: aarch64
            run_tests: true
          - target: x86_64-apple-darwin
            arch_label: x64
            dmg_suffix: x64
            run_tests: false
    defaults:
      run:
        shell: bash
        working-directory: pacergrip
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      CI: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: pacergrip/ui/package-lock.json

      - name: Setup Rust toolchain (${{ matrix.target }})
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'pacergrip -> target'
          shared-key: pacergrip-macos-${{ matrix.arch_label }}

      - name: Install UI dependencies
        working-directory: pacergrip/ui
        run: npm ci

      - name: Build UI bundle
        working-directory: pacergrip/ui
        run: npm run build

      - name: Run Rust tests & Clippy checks (native arm64)
        if: matrix.run_tests
        run: |
          cargo test --workspace --exclude pacergrip-app
          cargo clippy --workspace --all-targets -- -D warnings

      - name: Build macOS .app bundle & DMG (${{ matrix.target }})
        run: ./ui/node_modules/.bin/tauri build --target ${{ matrix.target }} --bundles dmg,app

      - name: Collect macOS DMG & verify .app bundle
        run: |
          set -euo pipefail
          mkdir -p dist-macos
          APP_BUNDLE="target/${{ matrix.target }}/release/bundle/macos/Pacer.app"
          if [ ! -d "$APP_BUNDLE" ]; then
            echo "Expected Pacer.app not found at $APP_BUNDLE" >&2
            exit 1
          fi
          shopt -s nullglob
          DMGS=(target/${{ matrix.target }}/release/bundle/dmg/*.dmg)
          if [ ${#DMGS[@]} -eq 0 ]; then
            echo "No DMG produced under target/${{ matrix.target }}/release/bundle/dmg/" >&2
            exit 1
          fi
          cp "${DMGS[@]}" dist-macos/
          ls -lh dist-macos

      - name: Upload macOS Release artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-macos-${{ matrix.arch_label }}
          path: pacergrip/dist-macos/*.dmg
          retention-days: 30
          if-no-files-found: error

  publish-release:
    name: Publish Unified Multi-Platform GitHub Release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows & macOS Release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate unified SHA256SUMS.txt
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum *.exe *.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt
          ls -lh

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Pacer ${{ github.ref_name }} (Windows & macOS)"
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## Pacer `${{ github.ref_name }}` — 原生多平台数据库桌面 IDE (Windows & macOS)

            ### 下载说明 / Downloads

            | 平台 / Platform | 安装包 / Artifact | 说明 / Notes |
            | :--- | :--- | :--- |
            | **macOS Apple Silicon (M1–M4)** | `Pacer_*_aarch64.dmg` | 原生 ARM64 `.app` 镜像，拖入「应用程序 / Applications」即可 |
            | **macOS Intel (x86_64)** | `Pacer_*_x64.dmg` | Intel Mac 原生镜像，拖入「应用程序 / Applications」即可 |
            | **Windows x64（安装版）** | `Pacer_*_x64-setup.exe` | NSIS 安装包（简中/英文向导，自动引导安装 WebView2） |
            | **Windows x64（绿色便携版）** | `Pacer-windows-x64-portable.exe` | 免安装单文件版，双击即用 |
            | **完整性校验 / Checksums** | `SHA256SUMS.txt` | Windows & macOS 全量资产 SHA-256 校验清单 |

            > **macOS 首次启动提示（未经过 Apple 公证的开源构建）**：
            > 若 macOS 提示“无法验证开发者”或“已损坏，无法打开”，请在终端执行以下命令解除隔离属性后重新打开：
            > ```bash
            > xattr -cr /Applications/Pacer.app
            > ```
            > 或右键点击 `Pacer.app` 选择「打开」并在「系统设置 → 隐私与安全性」中点击「仍要打开」。

            ### macOS 专项适配亮点 / macOS Highlights
            - **原生 Apple Icon & Retina 桌面集成**：新增 `icon.icns` 多分辨率应用图标与 macOS 11+ 最低系统适配（同步发布 Apple Silicon ARM64 与 Intel x64 双架构 `.dmg`）。
            - **macOS `.app` 安全工作空间策略**：在 `/Applications`、`AppTranslocation` 沙盒或只读挂载卷启动时自动落盘至标准 `~/Library/Application Support/cn.fwpt.pacer`（绝不向 `.app` 包内部写入文件）；若将 `Pacer.app` 放在用户自定义可写目录，则优先在同级创建便携 `pacer-workspace/`。
            - **原生 Cocoa 编辑菜单与快捷键体验**：保留系统级 Edit 菜单确保 WKWebView 输入框与编辑器内 `⌘+C / ⌘+V / ⌘+X / ⌘+A / ⌘+Z` 零阻碍；拦截默认 Close Window 菜单避免 `⌘+W` 误关整个主窗口，使其专注关闭当前 SQL / Markdown 标签页；全面适配 macOS `⌥` (Option) 键位映射与 `⌘ / ⌥ / ⇧` 图标显示、访达 (Finder) 定位与 `~/Library/DBeaverData` 自动扫描。

            ### v0.9.5 新增与优化 / What's New in v0.9.5
            - **连接账号导出给 DBeaver（含加密账号密码）**：
              - 支持将 Pacer 中保存的数据库连接配置与账号密码一键导出为标准 DBeaver `.dbp` 项目归档（`data-sources.json` + AES-128-CBC 加密 `credentials-config.json`）或 `.dbeaver` 目录文件，同时支持项目树右键导出单个连接或整组项目，在 DBeaver 中通过「文件 → 导入 → DBeaver → 项目」即可完整还原连接与凭据。
            - **原生 Excel (`.xlsx`) 导出与长整数防科学计数法**：
              - 结果集网格与数据源账号管理全面支持导出真 `.xlsx` 工作簿（冻结首行、自适应列宽）。
              - Rust 驱动查询层对超出 JS 安全整数精度（`2^53 - 1`）的 `BIGINT` / `BIGINT UNSIGNED` 自动保持无损十进制字符串传输，`.xlsx` 写入器将所有文本及 11 位及以上长整数（如雪花 ID、手机号、卡号、订单号）显式写入为文本单元格（`numFmtId=49` `@`），彻底杜绝科学计数法（`1.89E+18`）与精度丢失。
            - **实时红 / 绿连接健康状态指示点**：
              - 在左侧数据库树、顶部连接栏与连接设置弹窗「测试连接」区新增实时状态指示点：**绿色**表示连接测试或操作正常可用，**红色**表示无法连接或认证失败（悬停查看详情），**琥珀色闪烁**表示正在探测，**空心灰圈**表示尚未检测。

            ### v0.9.4 新增与优化 / What's New in v0.9.4
            - **原生 Redis 数据库直连与交互查询支持**：
              - 新增纯 Rust 异步 RESP2 + TLS (`redis://` / `rediss://`) 原生连接驱动（支持密码与 Redis 6+ ACL 多用户认证、`db0..db15` 键空间键值统计与只读保护）。
              - 数据库树非阻塞 `SCAN` 浏览 Key 列表并实时标注类型（`string` / `hash` / `list` / `set` / `zset` / `stream`）与剩余 TTL；双击或点击运行按 Key 类型智能生成 `GET` / `HGETALL` / `LRANGE` / `SMEMBERS` / `ZRANGE ... WITHSCORES` / `XRANGE` 并将结果结构化渲染为可筛选导出表格。
              - 支持逐行 Redis 命令控制台、Key 属性/Hash 字段结构检视、`MEMORY USAGE` / `INFO` 诊断计划，以及 `KEYS *` / `DEL` / `FLUSHDB` / `FLUSHALL` 高危命令 AST/风险拦截。
            - **高频数据库生产力套件**：
              - **CSV / TSV / JSON 数据导入向导**：支持原生文件选择与粘贴自动识别分隔符、字段映射、前 5 行预览、分批 `INSERT` 与忽略重复生成及执行。
              - **5 语言实体代码生成器**：一键根据表结构生成 Java (Lombok + MyBatis-Plus)、Go (GORM + JSON Tag)、TypeScript、Python (dataclass + Pydantic) 与 Rust (`serde`) 实体定义。
              - **可视化新建表设计器 & 表重命名弹窗**：表格化编辑字段、长度、主键/自增/非空、默认值、注释与索引，实时预览各库方言 `CREATE TABLE` DDL；支持跨方言安全重命名及 `TRUNCATE` / `DROP` 二次风险确认。
              - **结果集与结构/编辑器效率升级**：新增结果列显隐筛选弹窗、拖拽表头调宽（双击还原）、紧凑「导出 / 复制」菜单（Excel TSV / UTF-8 BOM CSV / JSON / Markdown / `INSERT` / `UPDATE`）、右击格式化 JSON/复制整列与隐藏列；右侧结构面板新增列默认值/注释展示及快捷操作入口；编辑器新增「压缩为单行 SQL」及「复制为 Java / JSON 代码字符串」。

            ### v0.9.3 新增与优化 / What's New in v0.9.3
            - **全面升级连接属性配置（Options / SSH-SSL / Schemas）并直连生效**：
              - **Options 选项页**：新增事务控制（Auto / Manual）、架构切换策略、会话时区（自动注入连接初始化 SQL）、单会话连接池限制、定时保活检测、空闲自动断开超时、连接启动脚本（`Startup script`）与元数据内省级别设置，并由原生 Rust 驱动池真实执行。
              - **SSH/SSL 安全传输页**：支持可复用的 SSH 跳板机配置档案管理、密钥文件浏览及一键复制 `ssh -N -L` 隧道命令；全面升级 SSL/TLS 配置面板（CA 根证书、客户端证书/私钥、Pacer 内置与系统信任库开关、校验模式）并在 MySQL / PostgreSQL / TiDB 原生 TLS 驱动生效。
              - **Schemas 架构与对象过滤页**：新增实时从目标实例拉取库表架构列表（`↻ 刷新架构`）、全选/清空/反选/搜索栏，以及 `Schema pattern`（支持通配符与 `-排除` 语法）与 `Object filter`（表/视图过滤），保存或点击「应用」后即时在数据库资源管理器中生效。
              - **测试连接状态横幅**：统一在连接弹窗底部展示可展开详情的连通性报错与状态横幅，清晰展示当前原生数据源引擎。

            ### v0.9.2 修复与优化 / What's New in v0.9.2
            - **消除控制台拖选 SQL 时的画面抖动**：锁定编辑器子工具栏（`.editor-subbar`）为固定单行高度，避免拖选字符数变化或长路径导致换行跳动；同步固定顶部「执行 / 执行选中」按钮宽度（`min-width`）与选中 AST 防抖策略，拖拽选区全程画面零抖动。
            - **优化底部结果页签与服务栏双层布局**：将「结果集 / 控制台输出 / 建表 DDL / 执行历史 / SQL 检查」主服务标签与动态查询结果页签拆分为上下独立的两层导航栏，彻底解决旧版单行挤压导致「结果集」被挤出视野及双横滚动条错位问题，并支持鼠标滚轮横向滚动及结果页行数角标提示。
            - **空表 / 0 行查询完整展示字段表头**：在原生 Rust 驱动（MySQL / TiDB / MariaDB / OceanBase / PostgreSQL / KingbaseES / openGauss / SQLite）查询返回 0 行时通过 `sqlx::Executor::describe` 自动提取并保留完整结果字段列头，搭配前端表字段元数据兜底，在空表网格内清晰展示所有列名、`查询结果为空（0 行）` 提示与一键「+ 新增一行」入口。

            ### v0.9.1 新增与优化 / What's New in v0.9.1
            - **`sel + Tab` 快捷查询联动顶部行数限制（默认 `100` 行）**：顶部查询行数上限默认调整为 `100 行` 并自动记忆用户切换结果；输入 `sel`（及 `selw` / `selo` / `selg` / `seld` / `selj` / `selin` / `cte` / `lim` 等查询模板）按 `Tab` 展开时，实时同步顶部行数并自动适配当前数据库方言（MySQL / PostgreSQL / TiDB / SQLite 生成 `LIMIT 100`，Oracle / 达梦 DM8 生成 `FETCH FIRST 100 ROWS ONLY`，SQL Server 生成 `TOP 100` / `OFFSET ... FETCH NEXT`，选择“不限”时自动省略限制子句）。
            - **分库方言「生成执行计划」拆分按钮**：编辑器子工具栏新增专属「生成执行计划」按钮与下拉模式菜单，自动识别当前数据源引擎生成精确语法的计划 SQL（支持 MySQL `EXPLAIN` / `EXPLAIN ANALYZE` / `EXPLAIN FORMAT=TREE`、TiDB `EXPLAIN ANALYZE` / `verbose`、MariaDB `ANALYZE` / `FORMAT=JSON`、OceanBase `EXTENDED` / `OUTLINE`、PostgreSQL / KingbaseES / openGauss `(COSTS, VERBOSE)` / `(ANALYZE, BUFFERS)` / `(FORMAT JSON)`、SQLite `EXPLAIN QUERY PLAN`、Oracle `DBMS_XPLAN`、达梦 DM8、SQL Server `SHOWPLAN`、ClickHouse `EXPLAIN PLAN indexes = 1` / `PIPELINE` / `AST`），支持新控制台打开、插入编辑器末尾、复制及带生产库安全拦截的一键执行。

            ### 核心特性 / Highlights
            - **SQL 缩写模板（Live Templates · `sel + Tab`）& 智能库表弹出**：输入 `sel`、`selw`、`selc`、`selo`、`selg`、`ins`、`upd`、`del` 等 27 个常用缩写按 `Tab` 秒展开并自动弹出当前数据库可选表与字段；支持完全自定义、启停与 JSON 导入导出。
            - **SQL 参数绑定执行（`:param` / `${param}` / `#{param}`）**：执行含参数占位符的脚本时自动弹出参数赋值窗（自动记住历史值、自动类型识别与实时 SQL 预览），跳过 `:=` 与 `::type` 类型强转。
            - **结果集商业级效率增强**：支持结果集右键快捷菜单（复制值 / 按此值筛选 / 生成 WHERE 条件 / 复制整行 JSON 与 `INSERT` SQL / 设为 NULL）、一键刷新结果、值检视器 JSON 格式化/压缩，以及 10/13 位 Unix 时间戳自动人类时间解析。
            - **数据库树与编辑器实用工具升级**：支持项目树右键/悬停刷新库表、复制数据源、一键 `COUNT(*)` 统计、生成带参数/转义的 `INSERT`/`UPDATE` 模板、多行文本一键「转 IN (...)」、SQL 大小写转换与 PROD 生产环境警示条。
            - **全平台原生支持（Windows x64 & macOS ARM64/Intel）**：原生 Apple `icon.icns`、macOS `.app` 安全工作空间、`⌘/⌥/⇧` 快捷键与自定义 Cocoa 菜单（防止 `⌘+W` 误关主窗）；三套护眼主题与多项目统一控制台日志。

            **运行环境 / System Requirements**：macOS 11 Big Sur 及以上 (Apple Silicon / Intel) · Windows 10 / 11 (x64)。
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
